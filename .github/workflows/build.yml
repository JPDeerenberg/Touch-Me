name: Build executables

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: touch_me
  APP_NAME: Touch Me Reforged

jobs:
  # Linux binaries are built inside Ubuntu 22.04 so they run on older glibc
  # systems (Debian 12, Ubuntu 22.04, ...) and not just on the newest distros.
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Install container tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git ca-certificates curl pkg-config

      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist build
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          stage="build/${APP_NAME}"
          mkdir -p "$stage"
          cp "target/release/${BIN_NAME}" "$stage/"
          cp LICENSE README.md "$stage/" 2>/dev/null || true
          chmod +x "$stage/${BIN_NAME}"
          tar -czf "dist/touch-me-linux-x86_64.tar.gz" -C build "${APP_NAME}"

          # Bare executable, for people who just want the binary.
          cp "target/release/${BIN_NAME}" "dist/touch-me-linux-x86_64"
          chmod +x "dist/touch-me-linux-x86_64"

          # .deb package (kept in sync with [package.metadata.deb]).
          deb="build/touch-me_${version}_amd64"
          mkdir -p "$deb/DEBIAN" "$deb/usr/bin" "$deb/usr/share/touch_me" \
                   "$deb/usr/share/pixmaps" "$deb/usr/share/applications" \
                   "$deb/usr/share/doc/touch-me"
          install -m 755 "target/release/${BIN_NAME}" "$deb/usr/bin/${BIN_NAME}"
          cp -r images players "$deb/usr/share/touch_me/"
          mkdir -p "$deb/usr/share/touch_me/custom_levels"
          cp assets/logo.png "$deb/usr/share/pixmaps/touch_me.png"
          cp assets/touch_me.desktop "$deb/usr/share/applications/"
          cp LICENSE "$deb/usr/share/doc/touch-me/copyright"
          cat > "$deb/DEBIAN/control" <<CONTROL
          Package: touch-me
          Version: ${version}
          Section: games
          Priority: optional
          Architecture: amd64
          Maintainer: Joris <joris@example.com>
          Depends: libc6, libgcc-s1, libx11-6, libxi6, libgl1
          Description: A fast-paced local multiplayer game of tag.
          CONTROL
          dpkg-deb --build --root-owner-group "$deb" "dist/touch-me-linux-x86_64.deb"
          dpkg-deb --info "dist/touch-me-linux-x86_64.deb" >/dev/null
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: touch-me-linux-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $stage = "build/$env:APP_NAME"
          New-Item -ItemType Directory -Force -Path dist, $stage | Out-Null
          Copy-Item "target/release/$env:BIN_NAME.exe" $stage
          Copy-Item LICENSE, README.md $stage -ErrorAction SilentlyContinue
          Compress-Archive -Path $stage -DestinationPath "dist/touch-me-windows-x86_64.zip"
          # Bare executable, for people who just want the .exe.
          Copy-Item "target/release/$env:BIN_NAME.exe" "dist/touch-me-windows-x86_64.exe"
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: touch-me-windows-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # Both macOS architectures build natively (arm64 on Apple Silicon, x86_64 on
  # the Intel image) and use explicit image labels so each one draws from its
  # own runner pool instead of the shared `macos-latest` queue.
  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-15
            target: aarch64-apple-darwin
            artifact: touch-me-macos-arm64
          - arch: x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: touch-me-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package .app bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist build
          app="build/${APP_NAME}.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"

          cp "target/${TARGET}/release/${BIN_NAME}" "$app/Contents/MacOS/${BIN_NAME}"
          chmod +x "$app/Contents/MacOS/${BIN_NAME}"
          cp LICENSE "$app/Contents/Resources/" 2>/dev/null || true

          # App icon (best effort: needs sips + iconutil from the Xcode CLI tools)
          if command -v sips >/dev/null && command -v iconutil >/dev/null && [ -f assets/logo.png ]; then
            mkdir -p build/AppIcon.iconset
            for size in 16 32 64 128 256 512; do
              sips -z "$size" "$size" assets/logo.png --out "build/AppIcon.iconset/icon_${size}x${size}.png" >/dev/null
              sips -z "$((size * 2))" "$((size * 2))" assets/logo.png --out "build/AppIcon.iconset/icon_${size}x${size}@2x.png" >/dev/null
            done
            iconutil -c icns build/AppIcon.iconset -o "$app/Contents/Resources/AppIcon.icns" || true
          fi

          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>${APP_NAME}</string>
            <key>CFBundleDisplayName</key>
            <string>${APP_NAME}</string>
            <key>CFBundleIdentifier</key>
            <string>com.joris.touch-me</string>
            <key>CFBundleVersion</key>
            <string>${GITHUB_RUN_NUMBER}</string>
            <key>CFBundleShortVersionString</key>
            <string>$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)</string>
            <key>CFBundleExecutable</key>
            <string>${BIN_NAME}</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

          # Ad-hoc signature: unsigned .app bundles are refused by macOS.
          codesign --force --deep --sign - "$app" || true

          # Bare executable, for terminal use.
          cp "target/${TARGET}/release/${BIN_NAME}" "dist/${{ matrix.artifact }}"
          chmod +x "dist/${{ matrix.artifact }}"

          # Disk image containing the .app, ready to drag into /Applications.
          dmg_root="build/dmg"
          mkdir -p "$dmg_root"
          ditto "$app" "$dmg_root/${APP_NAME}.app"
          hdiutil create -volname "${APP_NAME}" -srcfolder "$dmg_root" -ov -format UDZO \
            "dist/${{ matrix.artifact }}.dmg"

          tar -czf "dist/${{ matrix.artifact }}.tar.gz" -C build "${APP_NAME}.app"
          ls -la dist
        env:
          APP_NAME: Touch Me Reforged
          BIN_NAME: touch_me
          TARGET: ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
